; Model presets for llama-server's router (--models-preset). Each [section] is a model the
; chat page and the API offer, and its name is the API's "model" value. Keys are
; llama-server options without the leading dashes. Every file named here must be listed in
; models.list as "live" (bin/test checks), so `deploy llm` downloads it first.
version = 1

[*]
; Every layer on the iGPU, and 4 CPU threads (the container is capped at 4 CPUs too)
n-gpu-layers = 99
flash-attn = on
threads = 4
; Two requests at once, with 32k tokens of context each
parallel = 2
ctx-size = 65536

[qwen3.6-35b-a3b]
model = /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
; Qwen's recommended settings for thinking mode, general tasks (model card)
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5

[qwen3.6-35b-a3b-mtp]
; On trial: the same model with its multi-token prediction head, which drafts tokens for
; the model to check (speculative decoding). The answers are the same; only the speed differs.
model = /models/Qwen3.6-35B-A3B-MTP-UD-Q4_K_M.gguf
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5

[gemma-4-26b-a4b]
model = /models/gemma-4-26B_q4_0-it.gguf
; Google's recommended settings (model card)
temp = 1.0
top-p = 0.95
top-k = 64
