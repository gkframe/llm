; Model presets for llama-server's router (--models-preset). Each [section] is a model the
; chat page and the API offer, and its name is the API's "model" value. Keys are
; llama-server options without the leading dashes. Every file named here must be listed in
; models.list as "live" (bin/test checks), so `deploy llm` downloads it first.
version = 1

[*]
; Every layer on the iGPU, and 4 CPU threads (the container is capped at 4 CPUs too)
n-gpu-layers = 99
flash-attn = on
threads = 4
; Two requests at once, with 32k tokens of context each
parallel = 2
ctx-size = 65536

[qwen3.6-35b-a3b]
model = /models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
; Qwen's recommended settings for thinking mode, general tasks (model card)
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5

[gemma-4-26b-a4b]
model = /models/gemma-4-26B_q4_0-it.gguf
; Google's recommended settings (model card)
temp = 1.0
top-p = 0.95
top-k = 64

; Recursive Flint 40B-A2.5B, ggml-org's Q4_K_M. Kept after its trial (README: Flint benchmark).
; Its template ignores enable_thinking; send thinking_budget_tokens: 0 instead
[flint-40b-a2.5b]
model = /models/Flint-Q4_K_M.gguf
; Recursive's recommended settings (model card)
temp = 1.0
top-p = 0.95
top-k = 20

; On trial (2026-11-26): Qwen3.6 35B-A3B at unsloth's UD-Q5_K_M, against the Q4_K_M above.
; Kept or removed after the benchmark and quality eval (README)
[qwen3.6-35b-a3b-q5]
model = /models/Qwen3.6-35B-A3B-UD-Q5_K_M.gguf
; Same settings as the Q4_K_M section
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
presence-penalty = 1.5
