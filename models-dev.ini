; Presets for the dev instance (bin/dev): one small model, so trying a change never loads a
; second large model beside the live one. Files must be listed in models.list as "dev".
version = 1

[*]
n-gpu-layers = 99
flash-attn = on
threads = 4
parallel = 2
ctx-size = 16384

[qwen3.5-0.8b]
model = /models/Qwen3.5-0.8B-Q8_0.gguf
